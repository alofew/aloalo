<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRODUCT — ALOALO</title><link rel="stylesheet" href="css/style.css"></head><body>
<header id="site-header"></header>
<main class="section detail" id="detail"></main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script><script src="js/cart.js"></script><script src="js/main.js"></script>
<script>
const p = PRODUCTS.find(x => x.id === Number(new URLSearchParams(location.search).get("id")));
const box = document.getElementById("detail");
if (!p) { box.innerHTML = "<p>상품을 찾을 수 없습니다.</p>"; } else {
  box.innerHTML = `
    <div class="thumb big"><span>${p.name}</span></div>
    <div class="info">
      <h1>${p.name}</h1><div class="card-price">${won(p.price)}</div><p>${p.desc}</p>
      <div class="sizes" id="sizes">${p.sizes.map((s,i)=>`<button class="${i===0?"on":""}" data-s="${s}">${s}</button>`).join("")}</div>
      <button class="btn" id="add">ADD TO CART</button>
    </div>`;
  let size = p.sizes[0];
  document.querySelectorAll("#sizes button").forEach(b => b.onclick = () => {
    size = b.dataset.s; document.querySelectorAll("#sizes button").forEach(x => x.classList.toggle("on", x === b));
  });
  document.getElementById("add").onclick = () => { Cart.add(p.id, size); alert("장바구니에 담았습니다."); };
}
</script>
</body></html>
